<!DOCTYPE html>
<html lang="en" dir="ltr" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scheduled Maintenance | Aura Imaging Diagnostic Matrix</title>
    <link rel="shortcut icon" href="./mri.png" type="image/x-icon" />
    <link rel="stylesheet" href="./css/main.css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Anime.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
    <!-- Material Symbols for Icons -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              glossyBlueScheme: {
                pureWhite: "#FFFFFF",
                deepBlack: "#030712",
                royalBlue: "#2563EB",
                electricBlue: "#3B82F6",
                skyHighlight: "#60A5FA",
              },
            },
          },
        },
      };
    </script>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        background: #030712;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #60A5FA;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        overflow: hidden;
      }
      
      .medical-grid {
        position: absolute;
        inset: 0;
        background-image: linear-gradient(to right, rgba(37, 99, 235, 0.1) 1px, transparent 1px),
                          linear-gradient(to bottom, rgba(37, 99, 235, 0.1) 1px, transparent 1px);
        background-size: 40px 40px;
        pointer-events: none;
      }

      /* Glossy Reflection Card Effect */
      .glossy-card {
        background: linear-gradient(135deg, rgba(15, 23, 42, 0.95), rgba(3, 7, 18, 0.9));
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.2), 0 25px 50px -12px rgba(0, 0, 0, 0.9);
      }

      /* Smooth Pulsing Core Icon Box */
      .core-icon-box {
        position: relative;
        width: 80px;
        height: 80px;
        margin: 0 auto;
        background: rgba(37, 99, 235, 0.1);
        border: 2px solid rgba(59, 130, 246, 0.4);
        border-radius: 2rem;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 0 20px rgba(37, 99, 235, 0.2);
      }
    </style>
  </head>
  <body class="antialiased">

    <!-- Subtle background grid -->
    <div class="medical-grid"></div>

    <!-- Immersive Centered Maintenance Content Container -->
    <main class="relative z-10 max-w-xl w-full mx-auto px-6 text-center">
      <div class="glossy-card p-10 sm:p-14 rounded-3xl border-2 border-blue-500/40 shadow-2xl space-y-6" id="maintenanceCard">
        
        <div class="inline-block px-3 py-1 rounded-full bg-blue-600/20 border border-blue-500/30 text-blue-400 text-[10px] tracking-widest uppercase font-extrabold animate-pulse">
          SYSTEM MAINTENANCE IN PROGRESS
        </div>

        <!-- Clean Animated Core Icon -->
        <div class="core-icon-box" id="coreIcon">
          <span class="material-symbols-outlined text-blue-400 text-3xl">dns</span>
        </div>

        <!-- Animated Maintenance Header -->
        <div id="maintenanceTitle" class="text-3xl sm:text-4xl font-black text-transparent bg-clip-text bg-gradient-to-r from-blue-500 via-indigo-400 to-sky-300 tracking-tight">
          Upgrading Diagnostic Matrix
        </div>
        
        <p class="text-xs sm:text-sm text-neutral-300 font-semibold leading-relaxed">
          Aura Imaging systems are undergoing scheduled software synchronization and hardware optimization to serve you better. We will be back online shortly.
        </p>

        <div class="pt-2">
          <div class="inline-flex items-center gap-2 px-4 py-2 rounded-2xl bg-neutral-900 border border-neutral-800 text-xs font-mono text-neutral-400">
            <span class="w-2 h-2 rounded-full bg-blue-500 animate-pulse"></span>
            Estimated Restoration: &lt; 45 minutes
          </div>
        </div>

      </div>
    </main>

    <!-- Anime.js Smooth Floating & Breathing Animations -->
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        // Entrance animation for the card
        anime({
          targets: '#maintenanceCard',
          opacity: [0, 1],
          scale: [0.95, 1],
          translateY: [15, 0],
          easing: 'easeOutExpo',
          duration: 1000
        });

        // Continuous smooth breathing animation for the core icon box
        anime({
          targets: '#coreIcon',
          scale: [1, 1.08, 1],
          rotate: [0, 5, -5, 0],
          borderColor: ['rgba(59, 130, 246, 0.4)', 'rgba(96, 165, 250, 0.8)', 'rgba(59, 130, 246, 0.4)'],
          loop: true,
          easing: 'easeInOutSine',
          duration: 3500
        });

        // Continuous subtle pulsing animation on the title header
        anime({
          targets: '#maintenanceTitle',
          textShadow: [
            '0 0 10px rgba(37,99,235,0.2)',
            '0 0 25px rgba(59,130,246,0.5)',
            '0 0 10px rgba(37,99,235,0.2)'
          ],
          loop: true,
          easing: 'easeInOutSine',
          duration: 2500
        });
      });
    </script>
  </body>
</html>
