<!DOCTYPE html>
<html lang="en" dir="ltr" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 Error | Aura Imaging Diagnostic Matrix</title>
    <link rel="shortcut icon" href="./mri.png" type="image/x-icon" />
    <link rel="stylesheet" href="./css/main.css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Anime.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
    <!-- Material Symbols for Icons -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              glossyBlueScheme: {
                pureWhite: "#FFFFFF",
                deepBlack: "#030712",
                royalBlue: "#2563EB",
                electricBlue: "#3B82F6",
                skyHighlight: "#60A5FA",
              },
            },
          },
        },
      };
    </script>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        background: #030712;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #60A5FA;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        overflow: hidden;
      }
      
      .medical-grid {
        position: absolute;
        inset: 0;
        background-image: linear-gradient(to right, rgba(37, 99, 235, 0.1) 1px, transparent 1px),
                          linear-gradient(to bottom, rgba(37, 99, 235, 0.1) 1px, transparent 1px);
        background-size: 40px 40px;
        pointer-events: none;
      }

      /* Glossy Reflection Card Effect */
      .glossy-card {
        background: linear-gradient(135deg, rgba(15, 23, 42, 0.95), rgba(3, 7, 18, 0.9));
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.2), 0 25px 50px -12px rgba(0, 0, 0, 0.9);
      }

      /* Infinite radar sweep inside the card */
      .card-radar-container {
        position: relative;
        width: 140px;
        height: 140px;
        margin: 0 auto;
        border: 2px dashed rgba(59, 130, 246, 0.4);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }

      .radar-sweep-line {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 50%;
        height: 2px;
        background: linear-gradient(90deg, transparent, #3B82F6);
        transform-origin: left center;
        animation: spinRadar 4s linear infinite;
      }

      @keyframes spinRadar {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body class="antialiased">

    <!-- Subtle background grid -->
    <div class="medical-grid"></div>

    <!-- Immersive Centered 404 Content Container with Infinite Internal Animations -->
    <main class="relative z-10 max-w-xl w-full mx-auto px-6 text-center">
      <div class="glossy-card p-10 sm:p-14 rounded-3xl border-2 border-blue-500/40 shadow-2xl space-y-6" id="errorCard">
        
        <div class="inline-block px-3 py-1 rounded-full bg-blue-600/20 border border-blue-500/30 text-blue-400 text-[10px] tracking-widest uppercase font-extrabold animate-pulse">
          DIAGNOSTIC MATRIX FAULT
        </div>

        <!-- Infinite Internal Radar Scanner Graphic -->
        <div class="card-radar-container">
          <div class="radar-sweep-line"></div>
          <div class="w-4 h-4 rounded-full bg-blue-500 shadow-[0_0_15px_#3B82F6] animate-ping"></div>
        </div>

        <!-- Animated 404 Code Header -->
        <div id="errorCode" class="text-7xl sm:text-8xl font-black text-transparent bg-clip-text bg-gradient-to-r from-blue-500 via-indigo-400 to-sky-300 tracking-tighter">
          404
        </div>
        
        <h1 class="text-2xl sm:text-3xl font-black text-white tracking-tight">
          Target Vector Not Found
        </h1>
        
        <p class="text-xs sm:text-sm text-neutral-300 font-semibold leading-relaxed">
          The requested diagnostic sequence, file directory, or web node could not be located within the Aura Imaging matrix.
        </p>

        <div class="pt-4 flex flex-col sm:flex-row justify-center gap-3">
          <a href="index.html" class="bg-blue-600 hover:bg-blue-500 text-white px-8 py-3.5 rounded-full font-black text-xs uppercase tracking-widest shadow-[0_0_20px_rgba(37,99,235,0.5)] hover:scale-105 transition-all">
            Return to Matrix Home
          </a>
        </div>

      </div>
    </main>

    <!-- Anime.js Infinite Internal Card Animations -->
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        // Entrance animation for the card
        anime({
          targets: '#errorCard',
          opacity: [0, 1],
          scale: [0.9, 1],
          translateY: [20, 0],
          easing: 'easeOutExpo',
          duration: 1200
        });

        // Continuous high-tech glitch and pulsing animation on the 404 code header
        anime({
          targets: '#errorCode',
          scale: [1, 1.05, 0.97, 1],
          textShadow: [
            '0 0 15px rgba(37,99,235,0.3)',
            '0 0 35px rgba(59,130,246,0.8)',
            '0 0 15px rgba(37,99,235,0.3)'
          ],
          rotate: [0, -1, 1, 0],
          loop: true,
          easing: 'easeInOutSine',
          duration: 2200
        });
      });
    </script>
  </body>
</html>
